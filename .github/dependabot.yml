version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      react-and-router:
        patterns:
          [
            "react",
            "react-dom",
            "react-router",
            "@react-router/*",
            "@types/react",
            "@types/react-dom",
          ]
      contracts:
        patterns: ["@arcforges/*", "@bufbuild/*", "@connectrpc/*"]
      cloudflare:
        patterns: ["wrangler", "@cloudflare/*"]
      tooling:
        patterns: ["*"]
        exclude-patterns:
          [
            "react",
            "react-dom",
            "react-router",
            "@react-router/*",
            "@types/react",
            "@types/react-dom",
            "@arcforges/*",
            "@bufbuild/*",
            "@connectrpc/*",
            "wrangler",
            "@cloudflare/*",
          ]
    ignore:
      - dependency-name: "@types/node"
        versions: [">=25"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ["*"]
