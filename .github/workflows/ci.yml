name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "31 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"
  WRANGLER_SEND_METRICS: "false"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  # The C# product projects. The browser test project (tests/browser) is local opt-in tooling and is never restored
  # or built in CI (validation policy). win.slnx is not used here because it carries the retiring esproj entry.
  CSHARP_PROJECTS: >-
    src/ArcForges.Web.Ui/ArcForges.Web.Ui.csproj
    src/ArcForges.Web.Site/ArcForges.Web.Site.csproj
    src/ArcForges.Web.App/ArcForges.Web.App.csproj
    src/ArcForges.Web.Operations/ArcForges.Web.Operations.csproj
    tools/ArcForges.Web.Tooling/ArcForges.Web.Tooling.csproj
    tests/ArcForges.Web.Site.Tests/ArcForges.Web.Site.Tests.csproj
    tests/ArcForges.Web.Ui.Tests/ArcForges.Web.Ui.Tests.csproj
    tests/ArcForges.Web.App.Tests/ArcForges.Web.App.Tests.csproj
    tests/ArcForges.Web.Operations.Tests/ArcForges.Web.Operations.Tests.csproj
    tests/ArcForges.Web.Policy.Tests/ArcForges.Web.Policy.Tests.csproj
  CSHARP_TEST_PROJECTS: >-
    tests/ArcForges.Web.Site.Tests/ArcForges.Web.Site.Tests.csproj
    tests/ArcForges.Web.Ui.Tests/ArcForges.Web.Ui.Tests.csproj
    tests/ArcForges.Web.App.Tests/ArcForges.Web.App.Tests.csproj
    tests/ArcForges.Web.Operations.Tests/ArcForges.Web.Operations.Tests.csproj
    tests/ArcForges.Web.Policy.Tests/ArcForges.Web.Policy.Tests.csproj

jobs:
  source:
    name: Source (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          # Avoid blocking Windows validation on optional cache upload retries.
          cache: ${{ matrix.os == 'ubuntu-latest' && 'npm' || '' }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run check
        if: runner.os == 'Linux'
      - name: Set up the IDE project evaluation toolchain
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "10.0.401"
      - name: Verify effective IDE project declarations
        if: runner.os == 'Windows'
        run: node tooling/project.ts licence-evaluated
      - name: Retain source licence and provenance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: licence-evidence-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/evidence/licence-*.json
            artifacts/evidence/source-provenance.json
            artifacts/evidence/browser-graph.json
          if-no-files-found: error
          retention-days: 30

  csharp:
    name: C# restore, build, test and publish (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up the pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "10.0.401"
      - name: Restore with the locked NuGet closure
        run: |
          set -euo pipefail
          for project in $CSHARP_PROJECTS; do
            dotnet restore "$project" --locked-mode
          done
      - name: Build
        run: |
          set -euo pipefail
          for project in $CSHARP_PROJECTS; do
            dotnet build "$project" --no-restore -c Release
          done
      - name: Test (no browser E2E; the Playwright project is not built here)
        run: |
          set -euo pipefail
          for project in $CSHARP_TEST_PROJECTS; do
            dotnet test "$project" --no-build -c Release
          done
      - name: Publish the Account and Chat profiles
        run: |
          set -euo pipefail
          dotnet publish src/ArcForges.Web.App/ArcForges.Web.App.csproj --no-restore -c Release -o artifacts/profiles/app
      - name: Publish the Operations profile skeleton
        run: |
          set -euo pipefail
          dotnet publish src/ArcForges.Web.Operations/ArcForges.Web.Operations.csproj --no-restore -c Release -o artifacts/profiles/operations
      - name: Build the static Site twice and compare the bytes
        run: |
          set -euo pipefail
          tool=tools/ArcForges.Web.Tooling/bin/Release/net10.0/ArcForges.Web.Tooling.dll
          dotnet "$tool" site build --out artifacts/site --source-ref "$GITHUB_SHA"
          dotnet "$tool" site build --out artifacts/site-repeat --source-ref "$GITHUB_SHA"
          diff -r artifacts/site artifacts/site-repeat
          rm -rf artifacts/site-repeat
      - name: Retain the C# candidate outputs
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: web-csharp-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/site
            artifacts/profiles
          if-no-files-found: error
          retention-days: 30

  quality:
    name: Dependency audit and repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - name: Check workflow syntax
        run: |
          curl --fail --silent --show-error --location https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  '"$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: Scan Git history for secrets
        run: docker run --rm --network none -v "$PWD:/repo:ro" zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --redact=100 --no-banner

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions, csharp]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up the pinned .NET SDK for CodeQL
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "10.0.401"
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          languages: ${{ matrix.language }}
          # C# is built explicitly with the locked restore below, so CodeQL observes the real compilation.
          build-mode: ${{ matrix.language == 'csharp' && 'manual' || 'none' }}
      - name: Restore and build the C# projects for CodeQL
        if: matrix.language == 'csharp'
        run: |
          set -euo pipefail
          for project in $CSHARP_PROJECTS; do
            dotnet restore "$project" --locked-mode
          done
          for project in $CSHARP_PROJECTS; do
            dotnet build "$project" --no-restore -c Release
          done
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          category: /language:${{ matrix.language }}

  candidate:
    name: Build and verify the C# static candidate and profile bundle
    needs: [source, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      profiles-artifact-id: ${{ steps.upload-profiles.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Set up the pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "10.0.401"
      # WEB.40 deploy switch: the candidate is the C# static Site (tools/ArcForges.Web.Tooling, candidate build), sealed and
      # verified before upload. The Worker JavaScript and the build identity are emitted by Node from the reviewed sources,
      # because only Node can type-strip worker/index.ts and derive the identity from git.
      - name: Restore the locked tooling and the Blazor profile application
        run: |
          set -euo pipefail
          dotnet restore tools/ArcForges.Web.Tooling/ArcForges.Web.Tooling.csproj --locked-mode
          dotnet build tools/ArcForges.Web.Tooling/ArcForges.Web.Tooling.csproj --no-restore -c Release
          dotnet restore src/ArcForges.Web.App/ArcForges.Web.App.csproj --locked-mode
          dotnet publish src/ArcForges.Web.App/ArcForges.Web.App.csproj --no-restore -c Release -o artifacts/publish/app
      - name: Emit the Worker and the build identity from the reviewed sources
        run: |
          set -euo pipefail
          mkdir -p artifacts/inputs
          node tooling/candidate.ts worker artifacts/inputs/index.js
          node tooling/candidate.ts identity "0.1.0-ci.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" artifacts/inputs/build-info.json
      - name: Build the sealed candidate twice and compare the bytes
        run: |
          set -euo pipefail
          tool=tools/ArcForges.Web.Tooling/bin/Release/net10.0/ArcForges.Web.Tooling.dll
          version="0.1.0-ci.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          for out in artifacts/candidate artifacts/candidate-repeat; do
            dotnet "$tool" candidate build --out "$out" --repo "$GITHUB_WORKSPACE" --source-ref "$GITHUB_SHA" --version "$version" --identity artifacts/inputs/build-info.json --worker artifacts/inputs/index.js --dirty false
          done
          diff -r artifacts/candidate artifacts/candidate-repeat
          rm -rf artifacts/candidate-repeat
      - name: Verify the sealed candidate before upload
        run: node tooling/candidate.ts verify artifacts/candidate
      - id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: web-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/candidate
          if-no-files-found: error
          retention-days: 30
      # CLOUD.71: the profile bundle (one deterministic, digest-named archive of the Blazor application's publish), carried
      # to the deployment job unchanged. It stays outside the sealed candidate directory.
      - name: Build the Account and Chat profile bundle
        run: |
          set -euo pipefail
          dotnet tools/ArcForges.Web.Tooling/bin/Release/net10.0/ArcForges.Web.Tooling.dll profiles bundle --publish artifacts/publish/app --out artifacts/profiles
          dotnet tools/ArcForges.Web.Tooling/bin/Release/net10.0/ArcForges.Web.Tooling.dll profiles verify --bundle "$(ls artifacts/profiles/web-profiles-*.tar)"
      - id: upload-profiles
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: web-profiles-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/profiles
          if-no-files-found: error
          retention-days: 30

  verify:
    name: Verify
    if: always()
    needs: [source, csharp, quality, dependency-review, codeql, candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every applicable check
        env:
          SOURCE: ${{ needs.source.result }}
          CSHARP: ${{ needs.csharp.result }}
          QUALITY: ${{ needs.quality.result }}
          REVIEW: ${{ needs.dependency-review.result }}
          CODEQL: ${{ needs.codeql.result }}
          CANDIDATE: ${{ needs.candidate.result }}
          EVENT: ${{ github.event_name }}
        run: |
          test "$SOURCE" = success
          test "$CSHARP" = success
          test "$QUALITY" = success
          test "$CODEQL" = success
          test "$CANDIDATE" = success
          if [ "$EVENT" = pull_request ]; then test "$REVIEW" = success; else test "$REVIEW" = skipped; fi

  # Deployment step, outside validation (brief section 10). It ships the same sealed C# candidate that the candidate job
  # built and verified, after verifying it again here; the Cloudflare upload guards are unchanged (main push only).
  deploy:
    name: Deploy Cloudflare
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.verify.result == 'success' && needs.candidate.result == 'success'
    needs: [verify, candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare
    concurrency:
      group: cloudflare-main
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Set up the pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "10.0.401"
      - name: Build the candidate verifier
        run: |
          set -euo pipefail
          dotnet restore tools/ArcForges.Web.Tooling/ArcForges.Web.Tooling.csproj --locked-mode
          dotnet build tools/ArcForges.Web.Tooling/ArcForges.Web.Tooling.csproj --no-restore -c Release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.candidate.outputs.artifact-id }}
          path: artifacts/candidate
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.candidate.outputs.profiles-artifact-id }}
          path: artifacts/profiles
          merge-multiple: true
      - run: npm run deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
      - name: Create deployed prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node --input-type=module -e 'import fs from "node:fs"; console.log(JSON.parse(fs.readFileSync("artifacts/candidate/manifest.json")).version)')
          tar -czf "artifacts/web-${VERSION}.tar.gz" -C artifacts/candidate .
          gh release create "web-${VERSION}" "artifacts/web-${VERSION}.tar.gz" artifacts/deployment.json artifacts/profiles/web-profiles-*.tar --target "$GITHUB_SHA" --title "Web ${VERSION}" --prerelease --generate-notes
      - name: Preserve deployment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cloudflare-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/deployment.json
          if-no-files-found: warn
          retention-days: 90
